schemaVersion: '2.0.0'
fileExistenceTests:
  - name: Catalog directory
    path: /app/app/bunkodata/catalog
    shouldExist: true
    permissions: drwxr-xr-x
  - name: Catalog entry
    path: /app/app/bunkodata/catalog/known-entry.json
    shouldExist: true
    permissions: -rw-r--r--
fileContentTests:
  - name: Catalog bytes
    path: /app/app/bunkodata/catalog/known-entry.json
    expectedContents: ['^\{"id":"known-entry"\}\n$']
commandTests:
  - name: Import the production dependency without invoking its lazy operation
    command: /usr/local/bin/bun
    args: ['-e', 'await import("@acceptance/lazy"); console.log("IMPORT_PASSED")']
    expectedOutput: ['IMPORT_PASSED']
    exitCode: 0
  - name: Worker result
    command: /usr/local/bin/bun
    args: [/app/app/src/worker.ts, '--self-test']
    expectedOutput: ['^\{"processed":1\}\n$']
    exitCode: 0
metadataTest:
  user: '65532:65532'
  workdir: /app/app
  entrypoint: [/usr/local/bin/bun, '--no-install']
  cmd: [/app/app/src/server.ts]
