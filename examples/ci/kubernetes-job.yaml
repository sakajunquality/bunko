apiVersion: batch/v1
kind: Job
metadata:
  name: bunko-build
spec:
  template:
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
      containers:
        - name: build
          image: ghcr.io/sakajunquality/bunko@sha256:02cee62eed8c117ece5f3f31240c6272935fe3b776986d8c82bbbb31c2ad5765
          args: [build, /work, --push=false, --oci-layout, /out/image]
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - { name: source, mountPath: /work, readOnly: true }
            - { name: output, mountPath: /out }
            - { name: temporary, mountPath: /tmp }
            - { name: cache, mountPath: /home/bunko/.cache }
      volumes:
        - name: source
          persistentVolumeClaim:
            claimName: bunko-source
        - name: output
          persistentVolumeClaim:
            claimName: bunko-output
        - name: temporary
          emptyDir: {}
        - name: cache
          emptyDir: {}
