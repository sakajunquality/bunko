# Set _BUNKO_IMAGE to a reviewed container digest containing --auth-source.
# Requires bunko v0.10.0 or newer.
# Grant the Cloud Build service account Artifact Registry writer permission.
steps:
  - name: '${_BUNKO_IMAGE}'
    env: [HOME=/tmp/bunko-home, XDG_CACHE_HOME=/tmp/bunko-cache]
    args:
      - build
      - /workspace
      - --auth-source
      - google
      - --repo
      - '${_REGISTRY_REPO}'
      - --bare
      - --push=true
