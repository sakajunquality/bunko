build-image:
  image:
    name: ghcr.io/sakajunquality/bunko@sha256:7471b3afbd13e2ae51bdaf27d61a9d77b88f514f3bee45a7088440f4f25aa437
    entrypoint: [""]
  variables:
    HOME: /tmp/bunko-home
    XDG_CACHE_HOME: /tmp/bunko-cache
  script:
    - bunko build . --push=false --oci-layout image --report report.json
  artifacts:
    when: always
    paths: [image/, report.json]
