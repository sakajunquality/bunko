build-image:
  image:
    name: ghcr.io/sakajunquality/bunko@sha256:300ca12f6d85aeceaa32d76dac76aba2de2809e56b570b24debae2beee68dd6e
    entrypoint: [""]
  variables:
    HOME: /tmp/bunko-home
    XDG_CACHE_HOME: /tmp/bunko-cache
  script:
    - bunko build . --push=false --oci-layout image --report report.json
  artifacts:
    when: always
    paths: [image/, report.json]
