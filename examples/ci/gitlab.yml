build-image:
  image:
    name: ghcr.io/sakajunquality/bunko@sha256:b314b744103db075ccc9b787cce0a740a98c6edf2ce7740762a6972893411f47
    entrypoint: [""]
  variables:
    HOME: /tmp/bunko-home
    XDG_CACHE_HOME: /tmp/bunko-cache
  script:
    - bunko build . --push=false --oci-layout image --report report.json
  artifacts:
    when: always
    paths: [image/, report.json]
