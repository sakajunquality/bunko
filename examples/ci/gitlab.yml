build-image:
  image:
    name: ghcr.io/sakajunquality/bunko@sha256:0f550c7c5aef48fce3886ba5cc7805d5b0aba85f89b4dcba6b581c45d9e6813d
    entrypoint: [""]
  variables:
    HOME: /tmp/bunko-home
    XDG_CACHE_HOME: /tmp/bunko-cache
  script:
    - bunko build . --push=false --oci-layout image --report report.json
  artifacts:
    when: always
    paths: [image/, report.json]
