build-image:
  image:
    name: ghcr.io/sakajunquality/bunko@sha256:ea4edd5f47f9dd0c8e584409370784fa5936cb8d487ac8badbdc6863b5635f54
    entrypoint: [""]
  variables:
    HOME: /tmp/bunko-home
    XDG_CACHE_HOME: /tmp/bunko-cache
  script:
    - bunko build . --push=false --oci-layout image --report report.json
  artifacts:
    when: always
    paths: [image/, report.json]
