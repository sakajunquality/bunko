build-image:
  image:
    name: ghcr.io/sakajunquality/bunko@sha256:9372917d18b3787782d67f6a104f4f2faffecd97bf8b1f320f4e52675d90f761
    entrypoint: [""]
  variables:
    HOME: /tmp/bunko-home
    XDG_CACHE_HOME: /tmp/bunko-cache
  script:
    - bunko build . --push=false --oci-layout image --report report.json
  artifacts:
    when: always
    paths: [image/, report.json]
