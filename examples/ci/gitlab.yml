build-image:
  image:
    name: ghcr.io/sakajunquality/bunko@sha256:a90e6a5b8916b91e766dab1acb840d50991c6f2f84cdfab1a1a8728940f07059
    entrypoint: [""]
  variables:
    HOME: /tmp/bunko-home
    XDG_CACHE_HOME: /tmp/bunko-cache
  script:
    - bunko build . --push=false --oci-layout image --report report.json
  artifacts:
    when: always
    paths: [image/, report.json]
