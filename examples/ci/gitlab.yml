build-image:
  image:
    name: ghcr.io/sakajunquality/bunko@sha256:471715f3e0c88b845247f06187b5c241f16944c0e15154694844f28c3e1d5562
    entrypoint: [""]
  variables:
    HOME: /tmp/bunko-home
    XDG_CACHE_HOME: /tmp/bunko-cache
  script:
    - bunko build . --push=false --oci-layout image --report report.json
  artifacts:
    when: always
    paths: [image/, report.json]
