build-image:
  image:
    name: ghcr.io/sakajunquality/bunko@sha256:5a25538057320cff2ddde0ae98ce8cf10dc686cc3a2f157b368cc81ef19aff95
    entrypoint: [""]
  variables:
    HOME: /tmp/bunko-home
    XDG_CACHE_HOME: /tmp/bunko-cache
  script:
    - bunko build . --push=false --oci-layout image --report report.json
  artifacts:
    when: always
    paths: [image/, report.json]
