build-image:
  image:
    name: ghcr.io/sakajunquality/bunko@sha256:3f810a26ea2aedfab38b22a0b659828ff636a3ad66f0feadc17e149fb1367edd
    entrypoint: [""]
  variables:
    HOME: /tmp/bunko-home
    XDG_CACHE_HOME: /tmp/bunko-cache
  script:
    - bunko build . --push=false --oci-layout image --report report.json
  artifacts:
    when: always
    paths: [image/, report.json]
