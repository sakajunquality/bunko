build-image:
  image:
    name: ghcr.io/sakajunquality/bunko@sha256:9adf1365ed09a2067d839819f041cd4dfe52fde6cfee735390edf2876e7afee8
    entrypoint: [""]
  variables:
    HOME: /tmp/bunko-home
    XDG_CACHE_HOME: /tmp/bunko-cache
  script:
    - bunko build . --push=false --oci-layout image --report report.json
  artifacts:
    when: always
    paths: [image/, report.json]
