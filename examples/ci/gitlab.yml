build-image:
  image:
    name: ghcr.io/sakajunquality/bunko@sha256:4e53278d95cacb1e025dee01bc6bfedcb53bb0ab521399398e185263bd477644
    entrypoint: [""]
  variables:
    HOME: /tmp/bunko-home
    XDG_CACHE_HOME: /tmp/bunko-cache
  script:
    - bunko build . --push=false --oci-layout image --report report.json
  artifacts:
    when: always
    paths: [image/, report.json]
