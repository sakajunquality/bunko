build-image:
  image:
    name: ghcr.io/sakajunquality/bunko@sha256:822568df340c3491ab69635bdf7d63b8a315a75443c16fed7a62e62e2425581f
    entrypoint: [""]
  variables:
    HOME: /tmp/bunko-home
    XDG_CACHE_HOME: /tmp/bunko-cache
  script:
    - bunko build . --push=false --oci-layout image --report report.json
  artifacts:
    when: always
    paths: [image/, report.json]
