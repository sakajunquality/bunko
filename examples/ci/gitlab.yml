build-image:
  image:
    name: ghcr.io/sakajunquality/bunko@sha256:374f60f864226e03dc3eb47fcc3bd57954f148a200e6c5f4722ad0e50c4e3393
    entrypoint: [""]
  variables:
    HOME: /tmp/bunko-home
    XDG_CACHE_HOME: /tmp/bunko-cache
  script:
    - bunko build . --push=false --oci-layout image --report report.json
  artifacts:
    when: always
    paths: [image/, report.json]
