build-image:
  image:
    name: ghcr.io/sakajunquality/bunko@sha256:c890617b7d31c1b52c3207f7ac9db493c5d1ed3647a6a7b44cd1aff3c0efa6a8
    entrypoint: [""]
  variables:
    HOME: /tmp/bunko-home
    XDG_CACHE_HOME: /tmp/bunko-cache
  script:
    - bunko build . --push=false --oci-layout image --report report.json
  artifacts:
    when: always
    paths: [image/, report.json]
