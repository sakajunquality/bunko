build-image:
  image:
    name: ghcr.io/sakajunquality/bunko@sha256:b884a54d5c62bb872ee6598de3522180c920991c800858fd01c2380bf8a1b09f
    entrypoint: [""]
  variables:
    HOME: /tmp/bunko-home
    XDG_CACHE_HOME: /tmp/bunko-cache
  script:
    - bunko build . --push=false --oci-layout image --report report.json
  artifacts:
    when: always
    paths: [image/, report.json]
