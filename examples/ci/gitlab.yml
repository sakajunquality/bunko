build-image:
  image:
    name: ghcr.io/sakajunquality/bunko@sha256:96a39d371765f758f67db34ffdaeb97b9138d928c0c856b82ca51161086fefc6
    entrypoint: [""]
  variables:
    HOME: /tmp/bunko-home
    XDG_CACHE_HOME: /tmp/bunko-cache
  script:
    - bunko build . --push=false --oci-layout image --report report.json
  artifacts:
    when: always
    paths: [image/, report.json]
