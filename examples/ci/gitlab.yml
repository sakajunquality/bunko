build-image:
  image:
    name: ghcr.io/sakajunquality/bunko@sha256:5bc819edba84d1236d42bde60a5cc2a2d147c37525318141251bec5a6d210dea
    entrypoint: [""]
  variables:
    HOME: /tmp/bunko-home
    XDG_CACHE_HOME: /tmp/bunko-cache
  script:
    - bunko build . --push=false --oci-layout image --report report.json
  artifacts:
    when: always
    paths: [image/, report.json]
