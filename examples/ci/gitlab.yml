build-image:
  image:
    name: ghcr.io/sakajunquality/bunko@sha256:5a88d47ee434ae70db4ff8dab40c02ebe8a654931be5b62f67cf8fa2d5dfa401
    entrypoint: [""]
  variables:
    HOME: /tmp/bunko-home
    XDG_CACHE_HOME: /tmp/bunko-cache
  script:
    - bunko build . --push=false --oci-layout image --report report.json
  artifacts:
    when: always
    paths: [image/, report.json]
