build-image:
  image:
    name: ghcr.io/sakajunquality/bunko@sha256:489db88df785fe25d457ac8c1ff96224400f15911d810dab216a529221b30b5d
    entrypoint: [""]
  variables:
    HOME: /tmp/bunko-home
    XDG_CACHE_HOME: /tmp/bunko-cache
  script:
    - bunko build . --push=false --oci-layout image --report report.json
  artifacts:
    when: always
    paths: [image/, report.json]
