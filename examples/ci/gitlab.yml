build-image:
  image:
    name: ghcr.io/sakajunquality/bunko@sha256:ce1cb4515ae18c52b219f3d39b2e8b32783dce66f680b90c3ec7d1a03fd22e30
    entrypoint: [""]
  variables:
    HOME: /tmp/bunko-home
    XDG_CACHE_HOME: /tmp/bunko-cache
  script:
    - bunko build . --push=false --oci-layout image --report report.json
  artifacts:
    when: always
    paths: [image/, report.json]
