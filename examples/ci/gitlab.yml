build-image:
  image:
    name: ghcr.io/sakajunquality/bunko@sha256:02cee62eed8c117ece5f3f31240c6272935fe3b776986d8c82bbbb31c2ad5765
    entrypoint: [""]
  variables:
    HOME: /tmp/bunko-home
    XDG_CACHE_HOME: /tmp/bunko-cache
  script:
    - bunko build . --push=false --oci-layout image --report report.json
  artifacts:
    when: always
    paths: [image/, report.json]
