build-image:
  image:
    name: ghcr.io/sakajunquality/bunko@sha256:b29b44b83ecb873b44e672f5c88cb9c1d42c4ef8896bd9121608375473665028
    entrypoint: [""]
  variables:
    HOME: /tmp/bunko-home
    XDG_CACHE_HOME: /tmp/bunko-cache
  script:
    - bunko build . --push=false --oci-layout image --report report.json
  artifacts:
    when: always
    paths: [image/, report.json]
