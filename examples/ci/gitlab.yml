build-image:
  image:
    name: ghcr.io/sakajunquality/bunko@sha256:1f31e7756fb93926de29b2fce46b5070e35d268b7c48415d27d10725c5e1a8e9
    entrypoint: [""]
  variables:
    HOME: /tmp/bunko-home
    XDG_CACHE_HOME: /tmp/bunko-cache
  script:
    - bunko build . --push=false --oci-layout image --report report.json
  artifacts:
    when: always
    paths: [image/, report.json]
