build-image:
  image:
    name: ghcr.io/sakajunquality/bunko@sha256:f3575f26a2c90aee2655658e73e0690350f3dce5b4c16bded0ff032807692df5
    entrypoint: [""]
  variables:
    HOME: /tmp/bunko-home
    XDG_CACHE_HOME: /tmp/bunko-cache
  script:
    - bunko build . --push=false --oci-layout image --report report.json
  artifacts:
    when: always
    paths: [image/, report.json]
