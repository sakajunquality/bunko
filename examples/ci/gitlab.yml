build-image:
  image:
    name: ghcr.io/sakajunquality/bunko@sha256:4819a5bc95248421f13a8d48ee42212fe97bce0951ff9192c6c69346cd0eafa1
    entrypoint: [""]
  variables:
    HOME: /tmp/bunko-home
    XDG_CACHE_HOME: /tmp/bunko-cache
  script:
    - bunko build . --push=false --oci-layout image --report report.json
  artifacts:
    when: always
    paths: [image/, report.json]
