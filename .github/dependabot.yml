version: 2
multi-ecosystem-groups:
  dependencies:
    schedule:
      interval: weekly
updates:
  - package-ecosystem: github-actions
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: dependencies
  - package-ecosystem: bun
    directories:
      - /
      - /examples/application-validation
      - /examples/dependencies
      - /examples/font-validation
      - /examples/image-acceptance
      - /examples/workspace
    patterns: ["*"]
    multi-ecosystem-group: dependencies
    ignore:
      # See issue #185. TypeScript 7 removed the JavaScript compiler API used by bunko.
      - dependency-name: typescript
        versions: [">=7"]
    cooldown:
      default-days: 7
  - package-ecosystem: docker
    directory: /container
    patterns: ["*"]
    multi-ecosystem-group: dependencies
