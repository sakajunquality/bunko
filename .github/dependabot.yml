version: 2
multi-ecosystem-groups:
  dependencies:
    schedule:
      interval: weekly
updates:
  - package-ecosystem: github-actions
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: dependencies
  - package-ecosystem: bun
    directories:
      - /
      - /examples/application-validation
      - /examples/dependencies
      - /examples/font-validation
      - /examples/image-acceptance
      - /examples/workspace
    patterns: ["*"]
    multi-ecosystem-group: dependencies
    ignore:
      # Babel 8 removes legacy assert grammar. See docs/PARSER.md; review before June 2027.
      - dependency-name: "@babel/parser"
        versions: [">=8"]
      - dependency-name: "@babel/types"
        versions: [">=8"]
    cooldown:
      default-days: 7
  - package-ecosystem: docker
    directory: /container
    patterns: ["*"]
    multi-ecosystem-group: dependencies
