name: Registry conformance

on:
  workflow_dispatch:
    inputs:
      vendor:
        description: Registry provider
        required: true
        type: choice
        options: [ghcr, gar, dockerhub, ecr]
      repository:
        description: Dedicated fully qualified image repository (no tag)
        required: true
        type: string
      cache_repository:
        description: Optional separate cache repository on the same host
        type: string
      require_cache:
        description: Require verified Registry cache reuse
        type: boolean
        default: true

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BUNKO_SMOKE_VENDOR: ${{ inputs.vendor }}
      BUNKO_SMOKE_REPO: ${{ inputs.repository }}
      BUNKO_SMOKE_CACHE_REPO: ${{ inputs.cache_repository }}
      BUNKO_SMOKE_REQUIRE_CACHE: ${{ inputs.require_cache }}
      BUNKO_SMOKE_PLATFORMS: linux/amd64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.11
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Validate destination before authentication
        id: destination
        env:
          BUNKO_SMOKE_REPORT: ${{ runner.temp }}/registry-conformance.json
          DOCKER_CONFIG: ${{ runner.temp }}/bunko-docker
        run: |
          mkdir -p "$DOCKER_CONFIG"
          echo "DOCKER_CONFIG=$DOCKER_CONFIG" >> "$GITHUB_ENV"
          echo "BUNKO_SMOKE_REPORT=$BUNKO_SMOKE_REPORT" >> "$GITHUB_ENV"
          bun test/registry-preflight.ts >> "$GITHUB_OUTPUT"
      - name: Authenticate GHCR
        if: inputs.vendor == 'ghcr'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ vars.GHCR_USERNAME || github.actor }}
          password: ${{ secrets.GHCR_TOKEN || github.token }}
      - name: Authenticate Google with Workload Identity Federation
        if: inputs.vendor == 'gar'
        id: google
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GAR_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GAR_SERVICE_ACCOUNT }}
          token_format: access_token
          create_credentials_file: false
      - name: Log in to Artifact Registry
        if: inputs.vendor == 'gar'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ steps.destination.outputs.host }}
          username: oauth2accesstoken
          password: ${{ steps.google.outputs.access_token }}
      - name: Authenticate Docker Hub
        if: inputs.vendor == 'dockerhub'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: docker.io
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Authenticate AWS with OIDC
        if: inputs.vendor == 'ecr'
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ steps.destination.outputs.region }}
          allowed-account-ids: ${{ steps.destination.outputs.account }}
          audience: ${{ endsWith(steps.destination.outputs.host, '.amazonaws.com.cn') && 'sts.amazonaws.com.cn' || 'sts.amazonaws.com' }}
      - name: Log in to ECR
        if: inputs.vendor == 'ecr'
        uses: aws-actions/amazon-ecr-login@aded0d722166a37980e030aa969dda0bfe6b6947 # v2.1.7
        with:
          registries: ${{ steps.destination.outputs.account }}
      - run: bun run test:registry
      - name: Upload conformance report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: registry-conformance-${{ inputs.vendor }}
          path: ${{ runner.temp }}/registry-conformance.json
          if-no-files-found: ignore
