name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.11
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run check
      - run: bun run build
      - run: bun dist/bunko.js version
      - run: bun run test:bundled-smoke
      - run: bun run release:prepare
      - uses: ./
        with:
          distribution-directory: dist/release
      - run: bunko version

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.11
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run test:m1-smoke
        env:
          BUNKO_SMOKE_PLATFORMS: linux/amd64
      - run: bun run test:m2a-smoke
        env:
          BUNKO_SMOKE_PLATFORMS: linux/amd64
      - run: bun run test:m2b-smoke
        env:
          BUNKO_SMOKE_PLATFORMS: linux/amd64
      - run: bun run test:m2c-smoke
        env:
          BUNKO_SMOKE_PLATFORMS: linux/amd64
      - run: bun run test:m3-smoke
        env:
          BUNKO_SMOKE_PLATFORMS: linux/amd64
      - run: bun run test:registry-local
        env:
          BUNKO_SMOKE_PLATFORMS: linux/amd64
          BUNKO_SMOKE_REPORT: ${{ runner.temp }}/registry-local.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: registry-local-report
          path: ${{ runner.temp }}/registry-local.json
          if-no-files-found: ignore
