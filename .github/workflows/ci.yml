name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.3.11
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run check
      - run: bun run build
      - run: bun dist/bunko.js version

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.3.11
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run test:m1-smoke
        env:
          BUNKO_SMOKE_PLATFORMS: linux/amd64
      - run: bun run test:m2a-smoke
        env:
          BUNKO_SMOKE_PLATFORMS: linux/amd64
      - run: bun run test:m2b-smoke
        env:
          BUNKO_SMOKE_PLATFORMS: linux/amd64
