name: Registry credential source acceptance
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  github:
    if: github.repository == 'sakajunquality/bunko' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Install verified cosign
        run: bash scripts/validation/install-cosign.sh "$RUNNER_TEMP/cosign"
      - name: Publish, pull and sign using only the GitHub source
        env:
          GITHUB_TOKEN: ${{ github.token }}
          COSIGN_PASSWORD: ephemeral-validation-key
        run: |
          export DOCKER_CONFIG="$RUNNER_TEMP/empty-docker-config"
          mkdir -m 700 "$DOCKER_CONFIG"
          "$RUNNER_TEMP/cosign" generate-key-pair --output-key-prefix "$RUNNER_TEMP/signing"
          repo="ghcr.io/${GITHUB_REPOSITORY,,}-credential-validation"
          bun packages/bunko/cli.ts build examples/hello --repo "$repo" --bare --platform linux/amd64 --no-cache \
            --auth-source github --sign-key "$RUNNER_TEMP/signing.key" --cosign-path "$RUNNER_TEMP/cosign" --report "$RUNNER_TEMP/report.json"
          ref=$(bun -e 'const r=await Bun.file(process.argv[1]).json(); if(!r.publication?.reference)throw new Error("Missing publication");console.log(r.publication.reference)' "$RUNNER_TEMP/report.json")
          bun packages/bunko/cli.ts verify "$ref" --verify-key "$RUNNER_TEMP/signing.pub" --private-signatures --auth-source github --cosign-path "$RUNNER_TEMP/cosign"
          bun packages/bunko/cli.ts check-base --base "$ref" --platform linux/amd64 --auth-source github > "$RUNNER_TEMP/check-base.json"
          bun packages/bunko/cli.ts auth-check ghcr.io --auth-source github --scope "repository:${repo#ghcr.io/}:pull,push"
          test ! -f "$DOCKER_CONFIG/config.json"
          bun run build
          docker run --rm --read-only --cap-drop=ALL --security-opt=no-new-privileges --user 65532:65532 \
            --tmpfs /tmp:rw,nosuid,nodev --env HOME=/tmp --env GITHUB_TOKEN --env BUNKO_AUTH_SOURCES=github \
            --mount "type=bind,source=$PWD/dist,target=/cli,readonly" \
            oven/bun:1.4.2@sha256:9114c058aeae42162ee16dd5084b95fe9473970bb6bcb5b232ab1630f0546895 \
            bun /cli/bunko.js check-base --base "$ref" --platform linux/amd64 > "$RUNNER_TEMP/container-check.json"
          printf 'Native GHCR publish/pull, cosign signing/verification and nonroot read-only container authentication passed: `%s`\n' "$ref" >> "$GITHUB_STEP_SUMMARY"
