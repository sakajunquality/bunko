name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      published-version:
        description: Optional existing release version to verify through the setup action
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    permissions:
      contents: read
      id-token: write
      attestations: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.11
      - name: Restrict manual provenance to main
        if: github.event_name == 'workflow_dispatch'
        env:
          SOURCE_REF: ${{ github.ref }}
        run: test "$SOURCE_REF" = refs/heads/main
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run check
      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/')
        env:
          BUNKO_RELEASE_TAG: ${{ github.ref_name }}
        run: |
          git merge-base --is-ancestor HEAD origin/main
          bun -e 'import p from "./package.json"; if (process.env.BUNKO_RELEASE_TAG !== "v" + p.version) throw new Error("Tag/version mismatch");'
      - name: Prepare candidate
        id: candidate
        run: |
          bun run release:prepare
          bun -e 'import p from "./package.json"; import { appendFileSync } from "node:fs"; appendFileSync(process.env.GITHUB_OUTPUT!, "version=v" + p.version + "\n");'
      - name: Attest the prepared release inputs
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/release/bunko.js
            dist/release/SHA256SUMS
            dist/release/LICENSE
            dist/release/THIRD_PARTY_NOTICES.md
      - name: Preserve the signed bundle
        env:
          BUNDLE_PATH: ${{ steps.provenance.outputs.bundle-path }}
        run: cp "$BUNDLE_PATH" dist/release/PROVENANCE.jsonl
      - uses: ./
        with:
          version: ${{ steps.candidate.outputs.version }}
          distribution-directory: dist/release
      - run: bunko version
      - name: Verify installation from the published release
        id: published
        if: github.event_name == 'workflow_dispatch' && inputs.published-version != ''
        uses: ./
        with:
          version: ${{ inputs.published-version }}
      - name: Verify installed release version
        if: github.event_name == 'workflow_dispatch' && inputs.published-version != ''
        env:
          EXPECTED_VERSION: ${{ inputs.published-version }}
          PUBLISHED_BUNKO: ${{ steps.published.outputs.bunko-path }}
        run: test "$("$PUBLISHED_BUNKO" version)" = "${EXPECTED_VERSION#v}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bunko-release
          path: dist/release/
          if-no-files-found: error

  verify-candidate:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bunko-release
          path: candidate
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.11
      - name: Verify provenance from the downloaded bundle
        env:
          GH_TOKEN: ${{ github.token }}
          BUNKO_ATTESTATION_SOURCE_REF: ${{ github.ref }}
          BUNKO_ATTESTATION_SOURCE_DIGEST: ${{ github.sha }}
        run: bun scripts/verify-release.ts candidate "$(bun -p '"v" + require("./package.json").version')"
      - name: Reject an incorrect source identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          wrong_ref=refs/heads/main
          if [ "$GITHUB_REF" = refs/heads/main ]; then wrong_ref=refs/tags/v0.0.0-invalid; fi
          if gh attestation verify candidate/bunko.js --bundle candidate/PROVENANCE.jsonl \
            --repo "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
            --source-ref "$wrong_ref" --deny-self-hosted-runners; then
            echo "An incorrect source identity was accepted" >&2
            exit 1
          fi
      - name: Verify downloaded candidate
        working-directory: candidate
        run: |
          sha256sum --check SHA256SUMS
          bun bunko.js version

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [prepare, verify-candidate]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bunko-release
          path: dist/release
      - name: Publish the prepared assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cd dist/release
          sha256sum --check SHA256SUMS
          flags=()
          if [[ "$RELEASE_TAG" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG" \
            --notes-file ../../docs/RELEASE_NOTES.md "${flags[@]}" \
            bunko.js SHA256SUMS LICENSE THIRD_PARTY_NOTICES.md PROVENANCE.jsonl
  dispatch-container:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Dispatch container packaging after all release assets are published
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh workflow run container.yml --repo "$GITHUB_REPOSITORY" --ref main -f "version=$RELEASE_TAG"
          echo "Container publication continues separately: https://github.com/$GITHUB_REPOSITORY/actions/workflows/container.yml" >> "$GITHUB_STEP_SUMMARY"
