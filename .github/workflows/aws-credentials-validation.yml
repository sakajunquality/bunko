name: AWS credential acceptance
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ecr:
    if: github.repository == 'sakajunquality/bunko' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        identity: [web-identity, environment]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Check out reviewed AWS implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: 193befbde7819e417d967a4f13ae1553cbfdad7e
          path: candidate
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile --ignore-scripts
        working-directory: candidate
      - name: Validate OIDC, native ECR publication and pull
        env:
          BUNKO_ECR_REPOSITORY: ${{ vars.BUNKO_ECR_VALIDATION_REPOSITORY }}
          BUNKO_AWS_ROLE_ARN: ${{ vars.BUNKO_ECR_VALIDATION_ROLE_ARN }}
          BUNKO_AWS_IDENTITY: ${{ matrix.identity }}
        run: bun scripts/validation/aws-credentials.ts
