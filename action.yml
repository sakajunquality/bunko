name: Setup bunko
description: Install Bun and a checksum-verified bunko release on Linux or macOS
inputs:
  version:
    description: Explicit bunko release version
    default: v0.1.2
  bun-version:
    description: Bun runtime version (>=1.3.11; Bun 1.4 requires bunko rc.4 or later)
    default: 1.4.2
  repository:
    description: GitHub repository hosting the release
    default: sakajunquality/bunko
  token:
    description: Token with read access to the release repository
    default: ${{ github.token }}
  source-commit:
    description: Optional full source commit digest to constrain attestation verification
  verify-attestation:
    description: Verify signed provenance and version-tag identity before executing the CLI (requires gh and an attested release)
    default: 'false'
  distribution-directory:
    description: Optional pre-downloaded directory containing bunko.js, notices, and SHA256SUMS
outputs:
  version:
    description: Installed bunko version
    value: ${{ steps.install.outputs.version }}
  bunko-path:
    description: Absolute path to the bunko executable
    value: ${{ steps.install.outputs.bunko-path }}
runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version: ${{ inputs.bun-version }}
    - id: install
      shell: bash
      env:
        BUNKO_ACTION_PATH: ${{ github.action_path }}
        INPUT_SOURCE_COMMIT: ${{ inputs.source-commit }}
        INPUT_VERIFY_ATTESTATION: ${{ inputs.verify-attestation }}
        INPUT_VERSION: ${{ inputs.version }}
        INPUT_REPOSITORY: ${{ inputs.repository }}
        INPUT_TOKEN: ${{ inputs.token }}
        INPUT_DISTRIBUTION_DIRECTORY: ${{ inputs.distribution-directory }}
      run: bun "$BUNKO_ACTION_PATH/scripts/setup.ts"
